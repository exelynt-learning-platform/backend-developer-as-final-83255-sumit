spring.application.name=resource-booking

server.port=8080

# Database
spring.datasource.url=jdbc:h2:mem:resourcebooking
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=${JWT_SECRET:mySecretKeyForResourceBookingApplication2026Secure}
app.jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.exelynt.resource_booking=INFO